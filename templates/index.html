<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HeartWise - Relationship Advisor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8e8ee, #e8dff5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #7b3f61;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .question-label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #7b3f61;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7b3f61;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #632f4d;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            background: #f8f5f7;
            border-radius: 12px;
            line-height: 1.6;
            color: #333;
        }

        .response h3 {
            color: #7b3f61;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>❤️ HeartWise</h1>
            <p>A simple space to get thoughtful relationship advice.</p>
        </div>

        <form method="POST">

            <label class="question-label">
                What's on your mind?
            </label>

            <textarea
                name="question"
                placeholder="Tell me about your relationship situation..."
                required></textarea>

            <button type="submit">
                Get Advice
            </button>

        </form>

        {% if response %}

        <div class="response">
            <h3>HeartWise says:</h3>
            <p>{{ response }}</p>
        </div>

        {% endif %}

        <div class="footer">
            HeartWise provides general guidance and is not a substitute for professional help.
        </div>

    </div>

</body>
</html>
